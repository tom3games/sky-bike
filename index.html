<body>

<section id="loading" class="screen">

<section id="title" class="screen" hidden>

    <nav class="t-menu">
      <button class="course main" data-course="stage1"><b data-t="c_stage1">登る</b><small id="bestStage1"></small></button>

    </nav>
  </div>
  <div class="t-foot">
    <button id="howBtn" class="link" data-t="how">遊び方</button>
    <button id="langBtn" class="link">English</button>
    <button id="hardBtn" class="link">ハードコア 切</button>
    <button id="muteBtn" class="link" data-t="sound_on">音 あり</button>
  </div>
</section>

<section id="how" class="screen" hidden>
  <div class="panel">
    <h2 data-t="how">遊び方</h2>
    <p class="how-lead" data-t="how_lead"></p>
    <table class="keys">
      <tr><th data-t="k_thr">アクセル</th><td data-t="kc_thr">左クリック / ↑ / W</td><td>RT</td></tr>
      <tr><th data-t="k_brk">ブレーキ</th><td data-t="kc_brk">右クリック / ↓ / S</td><td>LT</td></tr>
      <tr><th data-t="k_back">後ろ体重</th><td>A / ←</td><td>L ←</td></tr>
      <tr><th data-t="k_fwd">前体重</th><td>D / →</td><td>L →</td></tr>
      <tr><th data-t="k_nit">ニトロ（押すだけで全開）</th><td>Space / Shift / N</td><td>A</td></tr>
      <tr class="pconly"><th data-t="k_cam">カメラ</th><td data-t="kc_cam">マウス</td><td>-</td></tr>
      <tr><th data-t="k_cp">休憩所からやり直す</th><td>R</td><td>B</td></tr>
      <tr><th data-t="k_pause">一時停止</th><td>Esc</td><td>START</td></tr>
    </table>
    <ul class="tips"><li data-t="tip1"></li><li data-t="tip2"></li><li data-t="tip3"></li><li data-t="tip4"></li><li data-t="tip5"></li><li data-t="tip6"></li><li data-t="tip7"></li><li data-t="tip8"></li><li data-t="tip9"></li></ul>
    <p class="credit" data-t="credit"></p>
    <button id="howClose" class="go" data-t="back">もどる</button>
  </div>
</section>

<div id="hud" hidden>
  <div class="watch"><span id="tm">0:00.00</span><span class="faults"><i data-t="faults">フォルト</i><b id="ft">0</b></span><svg id="nitroHud" viewBox="0 0 16 40" aria-hidden="true"><rect x="5" y="1" width="6" height="4" rx="1" fill="#b8bcc0"/><rect x="2.5" y="5" width="11" height="33" rx="4" fill="rgba(207,230,255,.18)" stroke="rgba(207,230,255,.6)" stroke-width="1"/><rect id="nitroFill" x="4" y="7" width="8" height="29" rx="3" fill="#5fb8ff"/></svg></div>
  <div class="alt" aria-hidden="true">
    <div class="alt-track"><div class="alt-best" id="altBest"></div><div class="alt-me" id="altMe"><span id="altNum">0m</span></div></div>
  </div>
  <div id="toast"></div>
  <div id="why"></div>
  <div id="tut"><span id="tutKey"></span><span id="tutTxt"></span></div>
  <div id="story"></div>
  <div id="talk"><span id="talkTxt"></span><span class="nx" id="talkNx"></span></div>
  <div id="keysMini"></div>
  <div class="tbar">
    <button id="bCp" class="ic" aria-label="休憩所からやり直す"><svg viewBox="0 0 24 24"><path d="M5 12a7 7 0 1 0 2.2-5.1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M4 3.5v4.5h4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <button id="bMenu" class="ic" aria-label="一時停止"><svg viewBox="0 0 24 24"><path d="M8.5 5v14M15.5 5v14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
  </div>
</div>

    <button class="tb lean" data-k="back" aria-label="後ろ体重"><svg id="tb-back" viewBox="0 0 48 48" aria-hidden="true"><g transform="translate(48 0) scale(-1 1)"><g transform="translate(0 6) scale(0.86) translate(4 4)"><g transform="rotate(-24 24 34)"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="33" r="6.5" stroke-width="3.6"/><circle cx="37" cy="33" r="6.5" stroke-width="3.6"/><path d="M11 33 L22 30 M37 33 L32 20 L36 18" stroke-width="2.6"/></g><path d="M17 27 L31 21 L33 26 L26 31 L19 31 Z" fill="currentColor"/><path d="M15 25 L24 22.5" stroke="currentColor" stroke-width="3" stroke-linecap="round"/><circle cx="25" cy="12" r="3" fill="currentColor"/><path d="M25 15 L23 21 L28 23" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></g></g></g><path d="M15 7 Q28 4 36 15" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"/><path d="M39 9 L36.5 16.5 L29.5 14" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>後ろ</span></button>
  </div>
  <div class="tr">
    <button class="tb small nit" data-k="nit" aria-label="ニトロ"><svg id="tb-nit" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6 C30 14 36 19 36 28 A12 12 0 0 1 12 28 C12 22 15 18 18 15 C18 20 20 23 23 24 C21 17 22 11 24 6 Z" fill="currentColor"/><path d="M24 25 C27 29 29 31 29 34 A5 5 0 0 1 19 34 C19 31 21 29 24 25 Z" fill="#0d0e0c" opacity=".55"/></svg><span>ニトロ</span></button>
    <button class="tb small" data-k="brk" aria-label="ブレーキ"><svg id="tb-brk" viewBox="0 0 48 48" aria-hidden="true"><path d="M24 9 V37" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M13 27 L24 38 L35 27" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg><span>ブレーキ</span></button>

  </div>
</div>

<section id="result" class="screen" hidden>
  <div class="panel tablet">
    <p class="tk-head" id="rCourse"></p>
    <p class="tk-title" data-t="arrived">到着</p>
    <div class="tk-row"><span data-t="time">時間</span><b id="rTime">0:00.00</b></div>
    <div class="tk-row"><span data-t="faults">フォルト</span><b id="rFaults">0</b></div>
    <div class="tk-row"><span data-t="best">自己ベスト</span><b id="rBest">—</b></div>
    <div class="tk-row tk-item" id="rItem" hidden><span data-t="items">持ち物</span><b><img id="rItemImg" alt=""><span id="rItemTxt"></span></b></div>
    <div class="stamp" id="rMedal">金</div>
    <div class="tk-btns">
      <button id="rRetry" class="go" data-t="retry">もう一回</button>
      <button id="rNext" class="go2" data-t="next">登る</button>
      <a id="rShare" class="go2" target="_blank" rel="noopener"><span data-t="share">Xでポスト</span></a>

<section id="pause" class="screen" hidden>
  <div class="panel small">
    <h2 data-t="paused">一時停止</h2>
    <button id="pResume" class="go" data-t="resume">続ける</button>
    <button id="pRestart" class="go2" data-t="restart">最初から</button>
    <button id="pHow" class="go2" data-t="how">遊び方</button>
    <button id="pMenu" class="link" data-t="menu">メニュー</button>
  </div>
</section>

<script>
(function(){
  var opt={passive:false};
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault()},opt)});
  document.addEventListener('touchmove',function(e){if(e.touches&&e.touches.length>1)e.preventDefault()},opt);
  var last=0;document.addEventListener('touchend',function(e){var n=Date.now();if(n-last<300&&!(e.target.closest&&e.target.closest('button,a')))e.preventDefault();last=n},opt);
  document.addEventListener('dblclick',function(e){e.preventDefault()},opt);
  window.addEventListener('wheel',function(e){if(e.ctrlKey)e.preventDefault()},opt);
  window.addEventListener('keydown',function(e){if((e.ctrlKey||e.metaKey)&&['+','-','=','0',';'].indexOf(e.key)>=0)e.preventDefault()});
})();
(function(){
  var errs=[];window.__skyErr=errs;
  window.addEventListener('error',function(e){errs.push((e.message||'error')+' @'+(e.filename||'')+':'+(e.lineno||''))});
  window.addEventListener('unhandledrejection',function(e){errs.push('reject: '+(e.reason&&e.reason.message||e.reason))});
  setTimeout(function(){
    if(window.__skyReady||(window.__jsUp&&!errs.length)) return;
    var d=document.createElement('div');d.id='boot-err';
    d.textContent='起動できませんでした / failed to start\n'+(errs.join('\n')||'(no error captured)')+'\n'+navigator.userAgent;
    document.body.appendChild(d);
  },12000);
})();
</script>
